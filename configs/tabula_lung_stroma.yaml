# ==============================================================================
# scRareRefine 实验配置: tabula_lung_stroma (Tabula Sapiens Lung 间质细胞子集)
# 从 tabula_sapiens_lung.h5ad 提取 compartment=Stromal & method=10X
# 2283 细胞 × 60606 基因 | 4 个供体批次 (TSP1/2/14/25)
# 细胞类型: adv_fibroblast(44%) pericyte(30%) adventitial(12%) | 稀有类: bronchial_smc(187, 8.2%)
# ==============================================================================

dataset:
  name: tabula_lung_stroma
  path: data/raw/tabula_lung_stroma/tabula_lung_stroma.h5ad
  use_raw: false                        # 提取时已把 raw counts 放入 X
  label_key: cell_type
  batch_key: donor_id                   # TSP1(26) / TSP2(40) / TSP14(35) / TSP25(86)

experiment:
  rare_class: bronchial smooth muscle cell  # 187 个 (8.2%)，4 donor 均有
  split_mode: batch_heldout
  rare_train_sizes:                     # 批量对比实验中稀有细胞已标注样本规模列表
    - 0.01                              # 代表标注该稀有细胞训练样本的 1%
    - 0.05                              # 代表标注该稀有细胞训练样本的 5%
    - 0.10                              # 代表标注该稀有细胞训练样本的 10%
    - all
  seeds:
    - 42
    - 43
    - 44
  unlabeled_category: Unknown

model:
  n_top_hvg: 2000                       # 2k 细胞规模，2000 HVG
  n_latent: 20
  scvi_max_epochs: 200
  scanvi_max_epochs: 100
  batch_size: 128

analysis:
  rare_threshold: 0.05
  rare_max_cells: 200
  review_fractions:
    - 0.01
    - 0.05
    - 0.10
    - 0.20
