# ==============================================================================
# scRareRefine 实验配置文件: immune_dc_cdc1 (以 cDC1 细胞亚群为稀有目标的配置)
# ==============================================================================

# 数据集加载配置
dataset:
  name: immune_dc                       # 数据集唯一标识符，用于确定保存输出的文件夹名
  path: data/raw/human_immune_health/human_immune_health_atlas_dc.h5ad # 原始 h5ad 数据存储路径
  use_raw: true                         # 是否读取 AnnData 中的 raw.X 层作为模型输入
  label_key: AIFI_L3                    # 细胞类型真实标签在 obs 中的列名
  batch_key: batch_id                   # 样本批次标识在 obs 中的列名（用于 scVI/scANVI 去除批次效应）

# 实验及标注参数配置
experiment:
  rare_class: cDC1                      # 目标稀有细胞类型的名称（例如经典树突状细胞 1 型 cDC1）
  rare_train_sizes:                     # 批量对比实验中稀有细胞已标注样本规模列表
    - 0.01
    - 0.05
    - 0.10
    - all
  seeds:                                # 批量实验所遍历的随机数种子列表
    - 42
    - 43
    - 44
  unlabeled_category: Unknown           # 未标注细胞及半监督学习时在模型中使用的占位标签名称
  output_dir: results/immune_dc_cdc1/audit # 结果审计输出目录

# scVI / scANVI 神经网络模型超参数
model:
  n_top_hvg: 3000                       # 高变基因选择数量（特征筛选，默认取前 3000 个方差最高的基因）
  n_latent: 30                          # 潜在空间表示维度（低维隐空间 Bottleneck 瓶颈层大小，默认 30 维）
  scvi_max_epochs: 200                  # 第一阶段：无监督 VAE 预训练的最大 Epoch 轮数
  scanvi_max_epochs: 100                 # 第二阶段：半监督 scANVI 表示微调的最大 Epoch 轮数
  batch_size: 256                       # 神经网络训练的批大小（Batch Size）

# 下游评估分析参数
analysis:
  rare_threshold: 0.05                  # 判定稀有类别的丰度阈值（占比低于 5% 判定为稀有）
  rare_max_cells: 200                   # 判定稀有细胞的最大上限细胞数
  review_fractions:                     # 用于主动学习审核的细胞筛选比例列表
    - 0.01
    - 0.05
    - 0.10
    - 0.20
