# ==============================================================================
# scRareRefine experiment config: mouse_pancreas_tms_10x
# Source: CELLxGENE Discover / Tabula Muris Senis
# File: data/raw/mouse/mouse_pancreas_tms_10x_raw_counts.h5ad
#
# 6,201 cells x 15,632 expressed genes | Mus musculus | pancreas | normal | 10x 3' v2
# Batch key: donor_id, 8 donors.
# Raw-count X exported from CELLxGENE Census 2025-11-17, using the current
# Tabula Muris Senis all-10x dataset id and tissue == 'pancreas'. All-zero
# genes were dropped after export. The website local H5AD remains non-integer
# X with max=10 and no layers, so it is kept only as provenance/reference.
#
# Main rare class is selected for stable batch-heldout evaluation:
#   pancreatic D cell: 272 cells (4.39%), seed42 split train/val/test=174/27/71.
#
# Gamma/PP-like semantic counterpart is available but has weak batch-heldout
# validation support:
#   pancreatic PP cell: 157 cells, seed42 split=123/2/32.
# ==============================================================================

dataset:
  name: mouse_pancreas_tms_10x
  path: data/raw/mouse/mouse_pancreas_tms_10x_raw_counts.h5ad
  use_raw: false
  label_key: cell_type
  batch_key: donor_id

experiment:
  rare_class: pancreatic D cell
  split_mode: batch_heldout
  separability_gate_mode: adaptive      # S<1.3 时启用 validation 5-fold OOF 安全审计；可用 CLI 切回 fixed
  rare_train_sizes:
    - 0.01
    - 0.05
    - 0.10
    - all
  seeds:
    - 42
    - 43
    - 44
  unlabeled_category: Unknown

model:
  n_top_hvg: 2000
  n_latent: 20
  scvi_max_epochs: 200
  scanvi_max_epochs: 100
  batch_size: 128

analysis:
  rare_threshold: 0.05
  rare_max_cells: 200
  review_fractions:
    - 0.01
    - 0.05
    - 0.10
    - 0.20
